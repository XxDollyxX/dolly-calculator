<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolly Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Quicksand & JetBrains Mono for a soft, aesthetic vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        dolly: {
                            bg: '#FAF5FF',
                            pink: '#F472B6',
                            pinkLight: '#FBCFE8',
                            purple: '#C084FC',
                            purpleLight: '#E9D5FF',
                            softDark: '#4A3E56',
                            btnNumber: '#FFFFFF',
                            btnOperator: '#F472B6',
                            btnFunc: '#E9D5FF',
                        }
                    },
                    boxShadow: {
                        'dolly-glass': '0 20px 40px rgba(192, 132, 252, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6)',
                        'dolly-btn': '0 4px 10px rgba(244, 114, 182, 0.15)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom smooth scrollbar for history panel */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(192, 132, 252, 0.5);
        }

        /* Keypress effect class */
        .btn-pressed {
            transform: scale(0.93) !important;
            filter: brightness(0.95);
        }
        
        /* Pastel Glassmorphism backdrop */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .glass-input {
            background: rgba(253, 242, 248, 0.7);
            border: 1px solid rgba(244, 114, 182, 0.2);
        }
    </style>
</head>
<body class="h-full bg-gradient-to-br from-pink-100 via-purple-50 to-indigo-100 text-slate-700 font-sans flex items-center justify-center p-4 sm:p-6 overflow-x-hidden select-none">

    <!-- Ambient pastel light spheres -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] sm:w-[500px] sm:h-[500px] bg-pink-300/30 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="fixed bottom-1/4 left-1/3 w-[250px] h-[250px] sm:w-[400px] sm:h-[400px] bg-purple-300/25 rounded-full blur-[90px] pointer-events-none"></div>

    <!-- Main Container -->
    <div class="relative w-full max-w-md mx-auto flex flex-col gap-4">

        <!-- Calculator Container -->
        <div class="glass-panel rounded-3xl p-5 sm:p-7 shadow-dolly-glass flex flex-col gap-5 transition-all duration-300">
            
            <!-- Top Bar: Dolly Brand & History Toggle -->
            <div class="flex justify-between items-center px-1">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-pink-400 animate-pulse"></span>
                    <h1 class="text-lg font-bold tracking-wide bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent flex items-center gap-1.5">
                        <i class="fa-solid fa-heart text-pink-400 text-xs"></i> Dolly Calculator
                    </h1>
                </div>
                
                <button id="toggle-history" title="Calculation History" class="p-2 rounded-xl text-purple-600 hover:text-purple-800 hover:bg-purple-100/60 transition-all flex items-center gap-1.5 text-xs font-semibold">
                    <i class="fa-solid fa-clock-rotate-left"></i> History
                </button>
            </div>

            <!-- Display Area -->
            <div class="glass-input rounded-2xl p-4 sm:p-5 flex flex-col justify-end items-end min-h-[110px] sm:min-h-[130px] overflow-hidden relative shadow-inner">
                <!-- Expression / History Line -->
                <div id="expression" class="text-xs sm:text-sm font-mono text-pink-400 min-h-[1.25rem] max-w-full overflow-x-auto whitespace-nowrap scrollbar-none tracking-wider mb-1 font-medium">
                    <!-- Dynamic expression display -->
                </div>
                
                <!-- Main Value Display -->
                <div id="display" class="text-3xl sm:text-4xl md:text-5xl font-mono font-bold tracking-tight text-slate-800 max-w-full overflow-x-auto whitespace-nowrap scrollbar-none transition-all duration-150 cursor-pointer" title="Click to copy">
                    0
                </div>

                <!-- Copy Indicator -->
                <div id="toast" class="absolute top-2 left-3 text-[10px] uppercase font-bold text-pink-600 bg-pink-100 border border-pink-300 px-2.5 py-0.5 rounded-full opacity-0 transition-opacity duration-300 pointer-events-none shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-check"></i> Copied!
                </div>
            </div>

            <!-- Keypad Matrix -->
            <div class="grid grid-cols-4 gap-2.5 sm:gap-3">
                <!-- Row 1 -->
                <button data-action="clear" class="calc-btn bg-pink-200/80 hover:bg-pink-300 text-pink-700 font-bold">AC</button>
                <button data-action="delete" class="calc-btn bg-purple-200/70 hover:bg-purple-300/80 text-purple-700 font-semibold">
                    <i class="fa-solid fa-backspace"></i>
                </button>
                <button data-action="percent" class="calc-btn bg-purple-200/70 hover:bg-purple-300/80 text-purple-700 font-semibold">%</button>
                <button data-action="operator" data-value="/" class="calc-btn bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-bold text-xl">÷</button>

                <!-- Row 2 -->
                <button data-value="7" class="calc-btn num-btn">7</button>
                <button data-value="8" class="calc-btn num-btn">8</button>
                <button data-value="9" class="calc-btn num-btn">9</button>
                <button data-action="operator" data-value="*" class="calc-btn bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-bold text-xl">×</button>

                <!-- Row 3 -->
                <button data-value="4" class="calc-btn num-btn">4</button>
                <button data-value="5" class="calc-btn num-btn">5</button>
                <button data-value="6" class="calc-btn num-btn">6</button>
                <button data-action="operator" data-value="-" class="calc-btn bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-bold text-xl">−</button>

                <!-- Row 4 -->
                <button data-value="1" class="calc-btn num-btn">1</button>
                <button data-value="2" class="calc-btn num-btn">2</button>
                <button data-value="3" class="calc-btn num-btn">3</button>
                <button data-action="operator" data-value="+" class="calc-btn bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-bold text-xl">+</button>

                <!-- Row 5 -->
                <button data-action="toggle-sign" class="calc-btn num-btn text-purple-600 font-bold">±</button>
                <button data-value="0" class="calc-btn num-btn">0</button>
                <button data-value="." class="calc-btn num-btn font-bold">.</button>
                <button data-action="calculate" class="calc-btn bg-gradient-to-r from-pink-500 to-purple-500 hover:from-pink-600 hover:to-purple-600 text-white font-bold shadow-dolly-btn text-xl">=</button>
            </div>
        </div>

        <!-- History Drawer / Overlay Panel -->
        <div id="history-panel" class="hidden glass-panel rounded-3xl p-5 shadow-dolly-glass flex flex-col gap-3 transition-all duration-300 max-h-[320px]">
            <div class="flex justify-between items-center border-b border-purple-100 pb-3">
                <span class="text-xs font-bold tracking-wider text-purple-700 uppercase flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-pink-400"></i> Dolly History
                </span>
                <button id="clear-history" class="text-xs text-rose-500 hover:text-rose-700 font-semibold transition-colors flex items-center gap-1 px-2.5 py-1 rounded-lg hover:bg-rose-50">
                    <i class="fa-solid fa-trash-can"></i> Clear
                </button>
            </div>
            
            <div id="history-list" class="flex flex-col gap-2 overflow-y-auto pr-1 flex-1 min-h-[140px]">
                <p id="empty-history" class="text-center text-xs text-purple-300 my-auto italic">No calculations yet ✨</p>
            </div>
        </div>
        
        <!-- Subtle Footer Note -->
        <p class="text-center text-[12px] text-purple-400/90 font-medium tracking-wide">
            Dolly Calculator &bull; Click result to copy
        </p>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        /**
         * State management for Dolly Calculator
         */
        class Calculator {
            constructor(displayElement, expressionElement) {
                this.displayElement = displayElement;
                this.expressionElement = expressionElement;
                this.history = [];
                this.clear();
            }

            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetDisplay = false;
                this.updateDisplay();
            }

            delete() {
                if (this.shouldResetDisplay) return;
                if (this.currentOperand === '0') return;
                
                if (this.currentOperand.length === 1 || (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.toString().slice(0, -1);
                }
                this.updateDisplay();
            }

            appendNumber(number) {
                if (this.shouldResetDisplay) {
                    this.currentOperand = '';
                    this.shouldResetDisplay = false;
                }

                // Prevent multiple decimals
                if (number === '.' && this.currentOperand.includes('.')) return;
                
                // Avoid leading zeros
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number.toString();
                } else {
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
                
                this.updateDisplay();
            }

            chooseOperation(operation) {
                if (this.currentOperand === '' && this.previousOperand === '') return;

                if (this.previousOperand !== '' && !this.shouldResetDisplay) {
                    this.compute();
                }

                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.shouldResetDisplay = true;
                this.updateDisplay();
            }

            toggleSign() {
                if (this.currentOperand === '0' || this.currentOperand === '') return;
                this.currentOperand = (parseFloat(this.currentOperand) * -1).toString();
                this.updateDisplay();
            }

            percentage() {
                if (this.currentOperand === '' || this.currentOperand === 'Error') return;
                const value = parseFloat(this.currentOperand);
                this.currentOperand = (value / 100).toString();
                this.updateDisplay();
            }

            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);

                if (isNaN(prev) || isNaN(current)) return;

                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '/':
                        if (current === 0) {
                            this.currentOperand = 'Error';
                            this.previousOperand = '';
                            this.operation = undefined;
                            this.shouldResetDisplay = true;
                            this.updateDisplay();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }

                // Clean floating point precision issues
                const formattedResult = Number(Math.round(parseFloat(computation + 'e10')) + 'e-10').toString();

                // Record history item
                const opSymbol = this.getOperatorSymbol(this.operation);
                this.history.unshift({
                    expression: `${this.formatDisplayNumber(this.previousOperand)} ${opSymbol} ${this.formatDisplayNumber(this.currentOperand)} =`,
                    result: formattedResult
                });
                renderHistory();

                this.currentOperand = formattedResult;
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetDisplay = true;
                this.updateDisplay();
            }

            getOperatorSymbol(op) {
                switch(op) {
                    case '+': return '+';
                    case '-': return '−';
                    case '*': return '×';
                    case '/': return '÷';
                    default: return '';
                }
            }

            formatDisplayNumber(numberStr) {
                if (!numberStr) return '';
                if (numberStr === 'Error') return 'Error';

                const [integerDigits, decimalDigits] = numberStr.split('.');
                const integerDisplay = isNaN(parseFloat(integerDigits)) ? '' : parseFloat(integerDigits).toLocaleString('en-US', { maximumFractionDigits: 0 });

                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            updateDisplay() {
                this.displayElement.innerText = this.formatDisplayNumber(this.currentOperand);
                
                if (this.operation != null) {
                    this.expressionElement.innerText = `${this.formatDisplayNumber(this.previousOperand)} ${this.getOperatorSymbol(this.operation)}`;
                } else {
                    this.expressionElement.innerText = '';
                }
            }
        }

        // Initialize Elements
        const displayElement = document.getElementById('display');
        const expressionElement = document.getElementById('expression');
        const historyPanel = document.getElementById('history-panel');
        const historyList = document.getElementById('history-list');
        const emptyHistory = document.getElementById('empty-history');
        const toggleHistoryBtn = document.getElementById('toggle-history');
        const clearHistoryBtn = document.getElementById('clear-history');
        const toast = document.getElementById('toast');

        const calc = new Calculator(displayElement, expressionElement);

        // Dynamic key button styling
        document.querySelectorAll('.calc-btn').forEach(btn => {
            btn.classList.add(
                'h-14', 'sm:h-16', 'rounded-2xl', 'text-lg', 'sm:text-xl', 
                'flex', 'items-center', 'justify-center', 'transition-all', 
                'duration-150', 'active:scale-95', 'shadow-dolly-btn', 'outline-none'
            );
            if (btn.classList.contains('num-btn')) {
                btn.classList.add('bg-white/80', 'hover:bg-white', 'text-slate-700', 'font-semibold');
            }
        });

        // Event Listeners for Keypad Buttons
        document.querySelectorAll('button[data-value]').forEach(button => {
            button.addEventListener('click', () => {
                const value = button.getAttribute('data-value');
                calc.appendNumber(value);
            });
        });

        document.querySelectorAll('button[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                switch (action) {
                    case 'clear':
                        calc.clear();
                        break;
                    case 'delete':
                        calc.delete();
                        break;
                    case 'operator':
                        calc.chooseOperation(button.getAttribute('data-value'));
                        break;
                    case 'calculate':
                        calc.compute();
                        break;
                    case 'toggle-sign':
                        calc.toggleSign();
                        break;
                    case 'percent':
                        calc.percentage();
                        break;
                }
            });
        });

        // Copy display result on display click
        displayElement.addEventListener('click', () => {
            const textToCopy = calc.currentOperand;
            if (textToCopy && textToCopy !== 'Error') {
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Failed to copy', err);
                }
                document.body.removeChild(textarea);
            }
        });

        function showToast() {
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 1800);
        }

        // Render History List
        function renderHistory() {
            if (calc.history.length === 0) {
                emptyHistory.classList.remove('hidden');
                historyList.querySelectorAll('.history-item').forEach(el => el.remove());
                return;
            }
            
            emptyHistory.classList.add('hidden');
            historyList.innerHTML = '';

            calc.history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item flex justify-between items-center p-2.5 rounded-xl bg-purple-50/70 hover:bg-pink-50 transition-colors cursor-pointer border border-purple-100/60';
                div.innerHTML = `
                    <span class="text-xs font-mono text-purple-400">${item.expression}</span>
                    <span class="text-sm font-mono font-bold text-pink-600">${item.result}</span>
                `;
                div.addEventListener('click', () => {
                    calc.currentOperand = item.result;
                    calc.shouldResetDisplay = true;
                    calc.updateDisplay();
                });
                historyList.appendChild(div);
            });
        }

        // Toggle History Drawer
        toggleHistoryBtn.addEventListener('click', () => {
            historyPanel.classList.toggle('hidden');
        });

        // Clear History
        clearHistoryBtn.addEventListener('click', () => {
            calc.history = [];
            renderHistory();
        });

        // Physical Keyboard Support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                calc.appendNumber(e.key);
                animateKeyPress(e.key);
            } else if (['+', '-', '*', '/'].includes(e.key)) {
                calc.chooseOperation(e.key);
                animateKeyPress(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                calc.compute();
                animateKeyPress('=');
            } else if (e.key === 'Backspace') {
                calc.delete();
                animateKeyPress('Backspace');
            } else if (e.key === 'Escape') {
                calc.clear();
                animateKeyPress('Escape');
            } else if (e.key === '%') {
                calc.percentage();
                animateKeyPress('%');
            }
        });

        // Keypress Visual Feedback Helper
        function animateKeyPress(key) {
            let button;
            if (key >= '0' && key <= '9') {
                button = document.querySelector(`button[data-value="${key}"]`);
            } else if (key === '.') {
                button = document.querySelector(`button[data-value="."]`);
            } else if (['+', '-', '*', '/'].includes(key)) {
                button = document.querySelector(`button[data-action="operator"][data-value="${key}"]`);
            } else if (key === 'Enter' || key === '=') {
                button = document.querySelector(`button[data-action="calculate"]`);
            } else if (key === 'Backspace') {
                button = document.querySelector(`button[data-action="delete"]`);
            } else if (key === 'Escape') {
                button = document.querySelector(`button[data-action="clear"]`);
            } else if (key === '%') {
                button = document.querySelector(`button[data-action="percent"]`);
            }

            if (button) {
                button.classList.add('btn-pressed');
                setTimeout(() => {
                    button.classList.remove('btn-pressed');
                }, 120);
            }
        }
    </script>
</body>
</html>
